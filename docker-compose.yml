version: '3.8'

services:
  api:
    build: .
    container_name: job_fetching_agent_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/gcp/adc.json
    volumes:
      - db_data:/app/data
      - ${GCP_ADC_PATH:-/home/mikolaj_admin/.config/gcloud/application_default_credentials.json}:/etc/gcp/adc.json:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api

volumes:
  db_data:
